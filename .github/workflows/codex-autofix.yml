# .github/workflows/codex-autofix.yml
name: Codex Auto-Fix

# Trigger: Automatically when Codex (bot) posts review comments
# No manual comment needed - fully automated!
on:
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  # Fallback: manual trigger if needed
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to auto-fix'
        required: true

# Required permissions
permissions:
  contents: write        # For committing changes
  pull-requests: write   # For commenting on PRs
  issues: read           # For reading PR comments

jobs:
  # Only run when Codex (bot) submits a review with comments
  # AND the last commit wasn't from auto-fix (prevents infinite loop)
  codex-auto-fix:
    if: |
      ((github.event_name == 'pull_request_review' &&
       github.event.review.user.type == 'Bot' &&
       github.event.review.state != 'APPROVED') ||
      (github.event_name == 'pull_request_review_comment' &&
       github.event.comment.user.type == 'Bot') ||
      github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest

    steps:
      # Step 0: Check out the PR branch first (required for git operations)
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 10  # Fetch last 10 commits to check for auto-fix loop

      # Step 1: Prevent infinite loop
      # If the last commit was from auto-fix, stop to prevent loop
      - name: Check for infinite loop
        id: loop-check
        run: |
          # Get the last commit message
          LAST_COMMIT=$(git log -1 --pretty=format:"%s")

          echo "🔍 Last commit: $LAST_COMMIT"

          # If the last commit was auto-fix, skip
          if echo "$LAST_COMMIT" | grep -q "codex: auto-apply review feedback"; then
            echo "⚠️ Loop detected - last commit was auto-fix"
            echo "Detected auto-fix commit - stopping to prevent infinite loop"

            # Set output to skip remaining steps
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Safe to proceed"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      # Step 2: Get PR details and review comments
      - name: Get PR details
        id: pr-details
        if: steps.loop-check.outputs.should_run == 'true'
        run: |
          # Handle both PR review event and manual trigger
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
          else
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi

          BRANCH="${{ github.event.pull_request.head.ref }}"

          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Get Codex review comments
        id: review-comments
        if: steps.loop-check.outputs.should_run == 'true'
        run: |
          PR_NUMBER="${{ steps.pr-details.outputs.number }}"

          # Fetch and encode review comments (base64 handles special characters safely)
          COMMENTS_JSON=$(gh api \
            repos/${{ github.repository }}/pulls/$PR_NUMBER/comments \
            --jq '.' 2>/dev/null || echo '[]')

          echo "comments<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENTS_JSON" | base64 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Create the task for Codex
      - name: Create Codex task
        id: create-task
        if: steps.loop-check.outputs.should_run == 'true'
        run: |
          # Decode base64-encoded comments
          COMMENTS_DECODED=$(echo "${{ steps.review-comments.outputs.comments }}" | base64 --decode)

          # Extract comment bodies from JSON using jq
          COMMENT_TEXT=$(echo "$COMMENTS_DECODED" | jq -r '.[].body' | tr '\n' '\\n')

          cat > /tmp/codex-task.md << 'EOTASK'
          # Auto-Fix Code Review Feedback

          You are working on fixing issues identified in code review. Please:

          ## Review Feedback

          EOTASK

          # Append the comments (already safely decoded)
          echo "$COMMENT_TEXT" >> /tmp/codex-task.md

          cat >> /tmp/codex-task.md << 'EOTASK'

          ## Instructions

          1. Read each piece of feedback carefully
          2. Locate the file and line(s) that need fixing
          3. Apply the fix following the project's code style
          4. Test your changes locally if possible
          5. Commit the fixes with descriptive commit messages

          ## Important

          - Only fix issues mentioned in the review
          - Don't make unrelated changes
          - If you're unsure about a fix, add a TODO comment
          - Use conventional commit messages: "fix: description" or "style: description"
          EOTASK

          echo "task_created=true" >> $GITHUB_OUTPUT

      # Step 4: Run Codex to apply fixes (using official openai/codex-action)
      - name: Run Codex to apply fixes
        id: apply-fixes
        uses: openai/codex-action@v1
        if: steps.loop-check.outputs.should_run == 'true'
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          allow-bots: true
          prompt: |
            You are working on fixing issues identified in code review for PR #${{ steps.pr-details.outputs.number }}.

            ## Review Feedback

            ${{ steps.review-comments.outputs.comments }}

            ## Instructions

            1. Read each piece of feedback carefully
            2. Locate the file and line(s) that need fixing
            3. Apply the fix following the project's code style
            4. Only fix issues mentioned in the review
            5. Use conventional commit messages: "fix: description"

            Commit your changes with: git commit -m "codex: auto-apply review feedback"
          sandbox: workspace-write
          codex-args: '["--ask-for-approval","never"]'

      # Step 5: Safety check before pushing
      - name: Safety check - review changes
        if: |
          steps.loop-check.outputs.should_run == 'true' &&
          steps.apply-fixes.outputs.changes == 'true'
        run: |
          echo "🔍 Reviewing changes..."

          # Count files changed
          CHANGED_FILES=$(git diff --name-only | wc -l)
          echo "Files changed: $CHANGED_FILES"

          # Count lines changed
          LINES_ADDED=$(git diff | grep -c "^+" || echo 0)
          LINES_REMOVED=$(git diff | grep -c "^-" || echo 0)
          echo "Lines added: $LINES_ADDED, removed: $LINES_REMOVED"

          # Safety gates
          if [ $CHANGED_FILES -gt 10 ]; then
            echo "❌ Too many files changed ($CHANGED_FILES)"
            echo "This may indicate unsafe changes."
            exit 1
          fi

          if [ $LINES_ADDED -gt 500 ]; then
            echo "⚠️ Large number of lines added ($LINES_ADDED)"
            echo "Please review carefully."
          fi

          # Show the diff
          echo "📋 Diff:"
          git diff --color=never

          echo "✅ Safety check passed"

      # Step 6: Commit and push fixes
      - name: Commit fixes
        if: |
          steps.loop-check.outputs.should_run == 'true' &&
          steps.apply-fixes.outputs.changes == 'true'
        run: |
          git config --local user.email "codex-autofix[bot]@users.noreply.github.com"
          git config --local user.name "codex-autofix[bot]"

          # Add all changes
          git add -A

          # Commit with marker for loop detection
          git commit -m "codex: auto-apply review feedback

          - Applied fixes from code review
          - This is an auto-fix commit (will not trigger another auto-fix)

          Co-authored-by: Codex <codex-auto-fix[bot]@users.noreply.github.com>"

      - name: Push fixes
        if: |
          steps.loop-check.outputs.should_run == 'true' &&
          steps.apply-fixes.outputs.changes == 'true'
        run: |
          git push origin ${{ steps.pr-details.outputs.branch }}

      # Step 7: Comment on PR
      - name: Comment success on PR
        if: |
          steps.loop-check.outputs.should_run == 'true' &&
          steps.apply-fixes.outputs.changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-details.outputs.number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `✅ **Codex auto-fix applied**

              Changes have been automatically applied based on the review feedback.

              **Review by:** Codex Bot
              **Commit:** \`${{ github.sha }}\`

              Please review the changes and merge if satisfied.

              ---
              *Note: This auto-fix commit will not trigger another auto-fix to prevent infinite loops.*`
            });

      - name: Comment no changes on PR
        if: |
          steps.loop-check.outputs.should_run == 'true' &&
          steps.apply-fixes.outputs.changes == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-details.outputs.number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `ℹ️ **Codex auto-fix complete**

              No changes were needed. The review feedback may have already been addressed or no actionable issues were found.`
            });

      - name: Comment loop detected on PR
        if: steps.loop-check.outputs.should_run == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = "${{ github.event.pull_request.number }}";
            if (prNumber !== "") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ **Codex auto-fix skipped**

                Auto-fix was not triggered because the last commit was already an auto-fix.
                This prevents infinite loops of auto-fix → review → auto-fix.

                If you need further fixes, please address them manually or request a new review.`
              });
            }

      # Step 8: Error handling
      - name: Comment failure on PR
        if: |
          failure() &&
          steps.loop-check.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-details.outputs.number }};
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `❌ **Codex auto-fix failed**

              The auto-fix workflow encountered an error. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

              You may need to apply fixes manually.`
            });

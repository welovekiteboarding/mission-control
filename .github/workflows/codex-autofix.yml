# Based on official OpenAI documentation:
# https://developers.openai.com/codex/github-action/

name: Codex Auto-Fix

on:
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to auto-fix'
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-autofix:
    runs-on: ubuntu-latest
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-fetch base and head refs
        run: |
          git fetch --no-tags origin \
            ${{ github.event.pull_request.base.ref }} \
            +refs/pull/${{ github.event.pull_request.number }}/head

      - name: Check for infinite loop
        id: loop-check
        run: |
          LAST_COMMIT=$(git log -1 --pretty=format:"%s")
          if echo "$LAST_COMMIT" | grep -q "codex: auto-apply review feedback"; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: Get review comments
        id: get-comments
        if: steps.loop-check.outputs.should_run == 'true'
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          COMMENTS=$(gh api \
            repos/${{ github.repository }}/pulls/$PR_NUMBER/comments \
            --jq '.[].body' | tr '\n' '\\n')

          mkdir -p .github/codex
          cat > .github/codex/autofix-prompt.md << EOF
          You are fixing code review feedback. Apply the following fixes:

          $COMMENTS

          Instructions:
          1. Read each issue carefully
          2. Fix only the issues mentioned
          3. Use the project's code style
          4. Commit changes with: git commit -m "codex: auto-apply review feedback"
          EOF

      - name: Run Codex
        id: run_codex
        if: steps.loop-check.outputs.should_run == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/autofix-prompt.md
          output-file: codex-output.md
          safety-strategy: drop-sudo
          sandbox: workspace-write

  post-feedback:
    runs-on: ubuntu-latest
    needs: codex-autofix
    if: needs.codex-autofix.outputs.final_message != ''
    steps:
      - name: Post Codex feedback
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FINAL_MESSAGE,
            });
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex-autofix.outputs.final_message }}

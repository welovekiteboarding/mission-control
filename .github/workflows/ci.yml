name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      spec_kit: ${{ steps.filter.outputs.spec_kit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            spec_kit:
              - 'spec-kit/**'

  test-typescript:
    name: Test TypeScript (root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install tsx
        run: npm install -g tsx

      - name: Run tests
        run: ./scripts/test.sh

  test-backend-convex:
    name: Test Backend (convex)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend/convex
        run: npm ci

      - name: Run tests
        run: bash ./backend/convex/scripts/test.sh

  test-backend-poller:
    name: Test Backend (poller)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: backend/poller
        if: ${{ hashFiles('backend/poller/package.json') != '' }}
        run: npm install

      - name: Run tests
        if: ${{ hashFiles('backend/poller/package.json') != '' }}
        run: bash ./backend/poller/scripts/test.sh

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: npm install

      - name: Run tests
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: bash ./frontend/scripts/test.sh

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - backend/convex
          - backend/poller
          - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.target }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.target }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.target }}
        run: npm test

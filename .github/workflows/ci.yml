name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: spec-kit/pyproject.toml

      - name: Install dependencies
        working-directory: spec-kit
        run: |
          pip install -e .
          pip install pytest pytest-cov

      - name: Run tests
        working-directory: spec-kit
        run: pytest --cov=specify_cli --cov-report=xml
